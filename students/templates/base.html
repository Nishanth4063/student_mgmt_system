<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
        .navbar { background: linear-gradient(135deg, #1f2937, #111827) !important; }
        .card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; }
        .nav-tabs .nav-link { color: #1f2937; font-weight: 500; }
        .nav-tabs .nav-link.active { background: #1f2937; color: white; border-radius: 8px 8px 0 0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="bi bi-mortarboard-fill me-2"></i>Student Management System</a>
        </div>
    </nav>

    <div class="container">
        <!-- 4 TABS NAVIGATION -->
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'students' %}active{% endif %}" href="/">
                    <i class="bi bi-people-fill me-1"></i> Students
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'departments' %}active{% endif %}" href="/departments/">
                    <i class="bi bi-building me-1"></i> Departments
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'subjects' %}active{% endif %}" href="/subjects/">
                    <i class="bi bi-book-fill me-1"></i> Subjects
                </a>
            </li>
            <li class="nav-item">
                 <a class="nav-link {% if active_tab == 'scores' %}active{% endif %}" href="/scores/">
                    <i class="bi bi-trophy-fill me-1"></i> Scores
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_tab == 'report' %}active{% endif %}" href="/report/">
                    <i class="bi bi-bar-chart-fill me-1"></i> View Report
                </a>
            </li>
        </ul>

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
