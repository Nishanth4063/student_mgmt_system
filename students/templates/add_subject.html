{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm border-0">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0"><i class="bi bi-book me-2"></i>Add Subject</h4>
                <a href="{% url 'subject_list' %}" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>

            <form method="POST" action="">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Subject Name</label>
                    {{ form.subject_name }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Subject Code</label>
                    {{ form.subject_code }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    {{ form.description }}
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle me-1"></i> Save Subject
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
