{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">
                    <i class="bi bi-pencil-square me-2 text-warning"></i>Update Department
                </h3>
                <a href="{% url 'department_list' %}" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100 py-2 text-white mt-2">
                    <i class="bi bi-check-circle me-2"></i>Update Department
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
