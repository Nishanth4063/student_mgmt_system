{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">
                    <i class="bi bi-building me-2 text-success"></i>Add Department
                </h3>
                <a href="{% url 'department_list' %}" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-500">Department Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Computer Science" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-500">Description</label>
                    <input type="text" name="description" class="form-control" placeholder="e.g. Comp. Sci. Eng." required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">
                    <i class="bi bi-save me-2"></i>Save Department
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
