<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h1>Student Management</h1>
    <a href="{% url 'add_student' %}">Add Student</a>
    <ul>
        {% for student in students %}
            <li>
                {{ student.name }} - {{ student.email }}
                <a href="{% url 'update_student' student.id %}">Edit</a>
                <a href="{% url 'delete_student' student.id %}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
