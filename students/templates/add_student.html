{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">
                    <i class="bi bi-person-plus-fill me-2 text-success"></i>Register New Student
                </h3>
                <a href="{% url 'home' %}" class="btn btn-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
            </div>
            <form method="POST">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-500">Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-500">Date of Birth</label>
                        <input type="date" name="dob" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-500">Roll Number</label>
                        <input type="text" name="roll_number" class="form-control" placeholder="Enter roll number" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-500">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-500">Join Date</label>
                        <input type="date" name="join_date" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-500">Department</label>
                        <select name="department" class="form-select" required>
                            <option value="">Select Department</option>
                            {% for dept in form.department.field.queryset %}
                            <option value="{{ dept.id }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 mt-2">
                    <i class="bi bi-save me-2"></i>Save Student
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
