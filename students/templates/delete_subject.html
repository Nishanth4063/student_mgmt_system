{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0 text-center">
            <i class="bi bi-exclamation-triangle text-danger display-4 mb-3"></i>
            <h4 class="fw-bold mb-2">Delete Subject</h4>
            <p class="text-muted">Are you sure you want to delete <strong>{{ subject.subject_name }}</strong> (<code>{{ subject.subject_code }}</code>)?</p>

            <form method="POST" action="">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-3">
                    <a href="{% url 'subject_list' %}" class="btn btn-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
